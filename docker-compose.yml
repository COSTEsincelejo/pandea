services:
  db:
    image: postgres:16-alpine
    container_name: pandea-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pandea_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

  db-init:
    image: postgres:16-alpine
    depends_on:
      - db
    volumes:
      - ./database:/schema
      - ./docker/init-db.sh:/docker/init-db.sh
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pandea_db
      DB_SERVER: db
    entrypoint: ["sh", "/docker/init-db.sh"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: pandea-secret-key
      DB_SERVER: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pandea_db
      DB_PORT: 5432
      WHATSAPP_NUMBER: 573017056143
      NODE_ENV: development
    depends_on:
      - db
      - db-init
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm start

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: https://humble-umbrella-g46xv5jggqw72pg9-4000.app.github.dev/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres-data:
